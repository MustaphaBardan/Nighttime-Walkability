<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Night Walkability Survey</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow" id="app-eyebrow">Research Survey</p>
        <h1 id="app-title">Night Walkability Survey</h1>
      </div>
      <div class="header-actions">
        <div class="header-language" id="header-language"></div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="true">Light mode</button>
      </div>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-state">
        <h2>Loading survey</h2>
        <p>Preparing images and questions.</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Night walkability research survey</span>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
