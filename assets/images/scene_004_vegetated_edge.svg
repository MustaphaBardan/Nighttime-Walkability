<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Vegetated edge with partial lighting</title>
  <desc id="desc">A night walking path beside dense vegetation, with partial lighting, darker edges, and a readable but less open route.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050d13"/>
      <stop offset="0.7" stop-color="#0d1617"/>
      <stop offset="1" stop-color="#17201b"/>
    </linearGradient>
    <linearGradient id="path" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4c5651"/>
      <stop offset="1" stop-color="#828c84"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a7" stop-opacity="0.9"/>
      <stop offset="0.28" stop-color="#f0b94f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f0b94f" stop-opacity="0"/>
    </radialGradient>
  </defs>
