<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Open square with brighter lighting</title>
  <desc id="desc">A wide open plaza-like night route with high lighting, long sightlines, low vegetation, and visible building edges.</desc>
  <defs>
