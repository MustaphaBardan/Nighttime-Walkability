      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#111d28"/>
      <stop offset="1" stop-color="#20292d"/>
    </linearGradient>
    <linearGradient id="square" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#68716f"/>
      <stop offset="1" stop-color="#b9c0b9"/>
    </linearGradient>
    <radialGradient id="brightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7cf" stop-opacity="1"/>
      <stop offset="0.22" stop-color="#ffe28f" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#ffe28f" stop-opacity="0"/>
    </radialGradient>
  </defs>
