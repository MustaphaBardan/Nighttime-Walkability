    <linearGradient id="pavement" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#303838"/>
      <stop offset="1" stop-color="#555d5a"/>
    </linearGradient>
    <radialGradient id="weakGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.74"/>
      <stop offset="0.32" stop-color="#e5a943" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e5a943" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
