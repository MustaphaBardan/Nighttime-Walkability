<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Dim enclosed street corridor</title>
  <desc id="desc">A narrow night corridor with tall side walls, low light, darker edges, and reduced route legibility.</desc>
  <defs>
